services:
  db:
    image: postgres:17
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PostGRE*26
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ecommerce-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:PostGRE*26@db:5432/ecommerce
    depends_on:
      - db

volumes:
  postgres_data: