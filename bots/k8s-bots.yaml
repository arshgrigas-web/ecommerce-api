apiVersion: batch/v1
kind: CronJob
metadata:
  name: customer-bot
  namespace: ecommerce
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: customer-bot
            image: arshgrig/ecommerce-bots:latest
            command: ["python", "customer_bot.py"]
            env:
            - name: API_URL
              value: "http://ecommerce-api:8000"
          restartPolicy: Never
---
