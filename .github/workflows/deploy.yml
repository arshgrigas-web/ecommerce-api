name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: arshgrig/ecommerce-api:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    
    steps:
    - name: Deploy to Kubernetes
      run: |
        docker pull arshgrig/ecommerce-api:latest
        docker save arshgrig/ecommerce-api:latest -o /tmp/ecommerce-api.tar
        sudo ctr -n k8s.io images import /tmp/ecommerce-api.tar
        kubectl rollout restart deployment ecommerce-api -n ecommerce
        kubectl rollout status deployment ecommerce-api -n ecommerce